# Tag vX.Y.Z (matching version in pyproject.toml) -> build -> PyPI (trusted publishing).
# One-time setup on pypi.org: add a trusted publisher for NameOcean/octodns-nameocean,
# workflow release.yaml, environment pypi.
name: Release
on:
  push:
    tags: ["v*"]
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Check the tag matches pyproject.toml
        run: |
          want="${GITHUB_REF#refs/tags/v}"
          have="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          [ "$want" = "$have" ] || { echo "tag v$want but pyproject.toml has $have"; exit 1; }
      - run: pip install build pytest requests_mock -e . && pytest -q && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
